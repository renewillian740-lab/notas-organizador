    <!-- Folded corner / Lines -->
    <rect x="22" y="18" width="14" height="3" rx="1.5" fill="#2563EB"/>
    <rect x="22" y="24" width="20" height="2.5" rx="1.25" fill="#93C5FD"/>
    <rect x="22" y="29" width="16" height="2.5" rx="1.25" fill="#93C5FD"/>
    <rect x="22" y="34" width="12" height="2.5" rx="1.25" fill="#CBD5E1"/>
  </g>

  <!-- Front Folder Overlay with Emerald accent -->
  <path d="M10 28C10 25.7909 11.7909 24 14 24H25.1716C26.2324 24 27.2498 24.4214 28 25.1716L30.8284 28H50C52.2091 28 54 29.7909 54 32V46C54 48.2091 52.2091 50 50 50H14C11.7909 50 10 48.2091 10 46V28Z" fill="url(#folderGrad)"/>

